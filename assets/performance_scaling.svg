<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="100%" height="100%" style="background: #0d1117; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="barGradStandard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="barGradPeak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="barGradBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0883e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#bd561d" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- Card Border -->
  <rect x="1" y="1" width="958" height="448" rx="11" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="40" y="46" fill="#f0f6fc" font-size="20" font-weight="600">CoreMark Throughput Across Compiler Optimizations</text>
  <text x="40" y="72" fill="#8b949e" font-size="13">Apple M2 (Avalanche Core @ 3.49 GHz) • Mean Iterations / Second (5 Runs Each) • EEMBC CoreMark v1.0</text>

  <!-- Gridlines & Y-Axis Labels -->
  <!-- Y max = 40000 -> chart bottom y = 360, chart top y = 140 (height = 220px, scale = 220 / 40000 = 0.0055 px/iter) -->
  <g stroke="#21262d" stroke-width="1" stroke-dasharray="4,4">
    <line x1="95" y1="360" x2="910" y2="360" stroke="#30363d" stroke-dasharray="none" stroke-width="1.5" />
    <line x1="95" y1="305" x2="910" y2="305" />
    <line x1="95" y1="250" x2="910" y2="250" />
    <line x1="95" y1="195" x2="910" y2="195" />
    <line x1="95" y1="140" x2="910" y2="140" />
  </g>

  <!-- Y-Axis Values -->
  <g fill="#8b949e" font-size="12" text-anchor="end" font-family="ui-monospace, SFMono-Regular, monospace">
    <text x="84" y="364">0</text>
    <text x="84" y="309">10k</text>
    <text x="84" y="254">20k</text>
    <text x="84" y="199">30k</text>
    <text x="84" y="144">40k</text>
  </g>

  <!-- Data Bars (scale = 0.0055)
       1: -O0              = 8475  -> h = 46.6  -> y = 313.4, x = 120
       2: Default          = 33640 -> h = 185.0 -> y = 175.0, x = 220
       3: -O1              = 34184 -> h = 188.0 -> y = 172.0, x = 320
       4: -O2              = 34037 -> h = 187.2 -> y = 172.8, x = 420
       5: -march=native    = 34656 -> h = 190.6 -> y = 169.4, x = 520
       6: -Ofast           = 34957 -> h = 192.3 -> y = 167.7, x = 620
       7: -O3 -march=native= 35170 -> h = 193.4 -> y = 166.6, x = 720
       8: -O3              = 35376 -> h = 194.6 -> y = 165.4, x = 820
       Bar width = 68
  -->

  <!-- Bar 1: -O0 -->
  <g>
    <rect x="120" y="313.4" width="68" height="46.6" rx="6" fill="url(#barGradBase)" />
    <text x="154" y="288" fill="#8b949e" font-size="11" text-anchor="middle">1.00×</text>
    <text x="154" y="304" fill="#f0883e" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">8,475</text>
    <text x="154" y="382" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle">-O0</text>
    <text x="154" y="400" fill="#8b949e" font-size="11" text-anchor="middle">Baseline</text>
  </g>

  <!-- Bar 2: Default -->
  <g>
    <rect x="220" y="175.0" width="68" height="185.0" rx="6" fill="url(#barGradStandard)" />
    <text x="254" y="150" fill="#8b949e" font-size="11" text-anchor="middle">3.97×</text>
    <text x="254" y="166" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">33,640</text>
    <text x="254" y="382" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle">Default</text>
    <text x="254" y="400" fill="#8b949e" font-size="11" text-anchor="middle">Base -O2</text>
  </g>

  <!-- Bar 3: -O1 -->
  <g>
    <rect x="320" y="172.0" width="68" height="188.0" rx="6" fill="url(#barGradStandard)" />
    <text x="354" y="147" fill="#8b949e" font-size="11" text-anchor="middle">4.03×</text>
    <text x="354" y="163" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">34,184</text>
    <text x="354" y="382" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle">-O1</text>
    <text x="354" y="400" fill="#8b949e" font-size="11" text-anchor="middle">Basic</text>
  </g>

  <!-- Bar 4: -O2 -->
  <g>
    <rect x="420" y="172.8" width="68" height="187.2" rx="6" fill="url(#barGradStandard)" />
    <text x="454" y="148" fill="#8b949e" font-size="11" text-anchor="middle">4.02×</text>
    <text x="454" y="164" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">34,037</text>
    <text x="454" y="382" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle">-O2</text>
    <text x="454" y="400" fill="#8b949e" font-size="11" text-anchor="middle">Explicit</text>
  </g>

  <!-- Bar 5: -march=native -->
  <g>
    <rect x="520" y="169.4" width="68" height="190.6" rx="6" fill="url(#barGradStandard)" />
    <text x="554" y="144" fill="#8b949e" font-size="11" text-anchor="middle">4.09×</text>
    <text x="554" y="160" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">34,656</text>
    <text x="554" y="382" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle">-march</text>
    <text x="554" y="400" fill="#8b949e" font-size="11" text-anchor="middle">Native</text>
  </g>

  <!-- Bar 6: -Ofast -->
  <g>
    <rect x="620" y="167.7" width="68" height="192.3" rx="6" fill="url(#barGradStandard)" />
    <text x="654" y="142" fill="#8b949e" font-size="11" text-anchor="middle">4.12×</text>
    <text x="654" y="158" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">34,957</text>
    <text x="654" y="382" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle">-Ofast</text>
    <text x="654" y="400" fill="#8b949e" font-size="11" text-anchor="middle">Relaxed</text>
  </g>

  <!-- Bar 7: -O3 -march -->
  <g>
    <rect x="720" y="166.6" width="68" height="193.4" rx="6" fill="url(#barGradStandard)" />
    <text x="754" y="141" fill="#8b949e" font-size="11" text-anchor="middle">4.15×</text>
    <text x="754" y="157" fill="#58a6ff" font-size="13" font-weight="600" text-anchor="middle" font-family="ui-monospace, monospace">35,170</text>
    <text x="754" y="382" fill="#c9d1d9" font-size="13" font-weight="500" text-anchor="middle">-O3 + nat</text>
    <text x="754" y="400" fill="#8b949e" font-size="11" text-anchor="middle">Combined</text>
  </g>

  <!-- Bar 8: -O3 (Peak) -->
  <g>
    <rect x="820" y="165.4" width="68" height="194.6" rx="6" fill="url(#barGradPeak)" />
    <!-- Peak Badge -->
    <rect x="831" y="108" width="46" height="18" rx="9" fill="#238636" stroke="#3fb950" stroke-width="1" />
    <text x="854" y="121" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">PEAK</text>
    <text x="854" y="139" fill="#7ee787" font-size="11" font-weight="600" text-anchor="middle">4.17×</text>
    <text x="854" y="155" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">35,376</text>
    <text x="854" y="382" fill="#3fb950" font-size="13" font-weight="600" text-anchor="middle">-O3</text>
    <text x="854" y="400" fill="#8b949e" font-size="11" text-anchor="middle">10.13 CM/MHz</text>
  </g>
</svg>